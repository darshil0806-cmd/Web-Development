<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        main{background-color: lightgray;
        padding: 10px;
        font-size: 20px;
        margin: auto;}
        nav{background-color: lightblue;}
        section{background-color: lightgreen;}
    </style>
</head>

<body>
    <header>
        <nav>
            <main>
                HI this is main tag
                <article>
                    <h1>Hi welcome to semantic tags</h1>
                    <section>
                        this is section tag inside article tag
                    </section>

                </article>
            </main>
            <ul>
                <li>home</li>
                <li>about</li>
                <li>contact</li>
            </ul>
        </nav>
    </header>
    <nav>
        <ul>
            <aside>
                <p>This is aside content
                <figure>
                    <img src="semantic-tags.png" alt="An example image" width="500" length="500">
                    <figcaption>This is an example image.</figcaption>
                </figure>
                </p>
            </aside>

            <main>
                <h1>What are semantic tags</h1>
                <article>
                    <h2>Article Title</h2>
                    <section>
                        <p>Content here</p>
                    </section>
                </article>

                <nav>
                    <ul>
                        <li>Home</li>
                        <li>About</li>
                    </ul>
                </nav>




            </main>
        </ul>
    </nav>

    <footer>
        copy right | all right reserved
    </footer>

</body>

</html>
