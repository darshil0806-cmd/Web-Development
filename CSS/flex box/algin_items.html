<!DOCTYPE html>
<html>
<head>
<style>
.flex-container {
  display: flex;
  align-items: center;
  height: 200px;
  background: peachpuff;
}
.flex-container div {
  background: teal;
  color: white;
  padding: 15px;
  margin: 5px;
}
</style>
</head>
<body>
<h2>Align Items Example</h2>
<div class="flex-container">
  <div>One</div>
  <div>Two</div>
  <div>Three</div>
</div>
</body>
</html>
