<!DOCTYPE html>
<html>
<head>
<style>
.flex-container {
  display: flex;
  flex-wrap: wrap;
  background: yellowgreen;
}
.flex-container div {
  width: 200px;
  margin: 10px;
  background: tomato;
  color: white;
  text-align: center;
  padding: 20px;
}
</style>
</head>
<body>
<h2>Flex Wrap Example</h2>
<div class="flex-container">
  <div>1</div><div>2</div><div>3</div>
  <div>4</div><div>5</div><div>6</div>
</div>
</body>
</html>
