<!DOCTYPE html>
<html>
<head>
<style>
.flex-container {
  display: flex;
  background: beige;
}
.flex-container div {
  padding: 20px;
  margin: 5px;
  background: steelblue;
  color: white;
}
.item1 { flex-grow: 1; }
.item2 { flex-grow: 3; }
.item3 { flex-grow: 1; }
</style>
</head>
<body>
<h2>Flex Grow Example</h2>
<div class="flex-container">
  <div class="item1">One</div>
  <div class="item2">Two</div>
  <div class="item3">Three</div>
</div>
</body>
</html>
