<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box1{
            background-color: lightcoral;
            position: absolute;
            /* position absolute ena nearest position absolute ne sodhe 
            je ahya parent che toh tena relave ma top ane left set thai  */

            top: 0px;
            left: 13px;
           
        }
        .box2{
            background-color: lightseagreen;
        }
        .box3{
            background-color: lightgoldenrodyellow;
            position: fixed;
            bottom: 0px;
            left: 8vw;
            height: 111px;
        }
        .box4{
            background-color: lightpink;
        }
        .box{
            border: 2px solid burlywood;
            height : 133px;
            width: 80vw;
            margin: 3px;
            padding: 3px;

        }
        .parent{
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1">position absolute ena nearest position absolute ne sodhe 
            je ahya parent che toh tena relave ma top ane left set thai </div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
