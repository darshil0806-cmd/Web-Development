
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Position Relative Example</title>
  <style>
    img {
      position: relative;
      left: 100px;  /* Move 100px right */
      top: 50px;    /* Move 50px down */
      width: 100px;
    }

  </style>
</head>
<body>
  <p style="background-color: aquamarine; padding: 10px; border: 3px solid black;">This is paragraph 1
     CSS Position Relative Example
  </p>
  <p>This is paragraph 2</p>
  <img src="./logo.png" alt="logo">
  <p>This is paragraph 3</p>
  <p>Elements are positioned relative to the normal position in the document.

You can use the top, right, bottom, and left properties to move the element from its original position.

</p>
</body>
</html>
