<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    h1 {
      position: fixed;
      top: 10px;
      right: 20px;
      background: yellow;
    }
  </style>
</head>
<body>
  <h1>CodeWithHarry</h1>
  <p>Scroll down to see the effect...</p>
  <p>An element with position: fixed; is positioned relative to the viewport (the screen itself). It does not move when the page is scrolled.

This is useful for creating elements like fixed headers or footers.</p>
  <p style="margin-top:1000px;">End of page</p>
  
</body>
</html>
