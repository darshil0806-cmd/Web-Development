<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    h1 {
      position: sticky;
      top: 0;
      background: lightblue;
    }
  </style>
</head>
<body>
  <h1>Sticky Header</h1>
  <p>Scroll down...</p>
  <p>Position sticky is a hybrid between 'relative' and 'fixed'.

It allows an element to become "stuck" to the top or bottom of its container when scrolling,
 but it behaves like relative positioning within the container until it reaches a specified offset.</p>
  <p style="margin-top:1000px;">End of page</p>
</body>
</html>
