<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Radial Gradient</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    .radial-gradient-box {
      width: 400px;
      height: 200px;
      margin: auto;
      border: 2px solid #333;
      background-image: radial-gradient(circle, blue 20%, orange, red);
    }
  </style>
</head>
<body>
  <h2>Radial Gradient Example</h2>
  <div class="radial-gradient-box"></div>
  <p>The gradient starts with <b>blue (20%)</b> at the center, then blends to <b>orange → red</b>.</p>
</body>
</html>
