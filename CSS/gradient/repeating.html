<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Repeating Gradient</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    .repeating-gradient-box {
      width: 400px;
      height: 200px;
      margin: auto;
      border: 2px solid #333;
      background-image: repeating-linear-gradient(45deg, blue, orange 20px, red 40px);
    }
  </style>
</head>
<body>
  <h2>Repeating Gradient Example</h2>
  <div class="repeating-gradient-box"></div>
  <p>The gradient repeats every <b>40px</b>, creating a striped pattern of blue, orange, and red.</p>
</body>
</html>
