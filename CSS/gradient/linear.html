<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Linear Gradient</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    .linear-gradient-box {
      width: 400px;
      height: 200px;
      margin: auto;
      border: 2px solid #333;
      background-image: linear-gradient(100deg, blue, orange, red);
    }
  </style>
</head>
<body>
  <h2>Linear Gradient Example</h2>
  <div class="linear-gradient-box"></div>
  <p>The gradient flows diagonally at 100 degrees, blending blue → orange → red.</p>
</body>
</html>
