<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Conic Gradient</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    .conic-gradient-box {
      width: 400px;
      height: 200px;
      margin: auto;
      border: 2px solid #333;
      background-image: conic-gradient(blue, orange, red);
    }
  </style>
</head>
<body>
  <h2>Conic Gradient Example</h2>
  <div class="conic-gradient-box"></div>
  <p>The gradient spins around the center like a cone, blending <b>blue → orange → red</b>.</p>
</body>
</html>
