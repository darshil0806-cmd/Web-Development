<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS display properties</title>
    <style>
        .box {
            width: 300px;
            height: auto;
            border: 2px solid burlywood;
            display: inline-block;
            margin: 20px;
            padding: 10px;
            background-color: lightcoral;


        }
        div {
            border: 2px solid green;
            margin: 20px;
            padding: 10px;
            background-color: lightblue;
            }
    </style>
</head>
<body>
    <div class ="box">
        I am A box
    </div>
    <div class = "box">also a nice box</div>
    <div>
        i am a div without class and inline display
    </div>
</body>
</html>
