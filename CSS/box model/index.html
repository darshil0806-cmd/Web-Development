<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS box model</title>
    <style>
        .box{
            color: black;
            font-size: 21px;
            border-radius: 10px;
            border-color: aquamarine;
            border: 20px solid blueviolet;
            padding: 10px;
            margin: 10px;
/* properties common for both boxes  */
        }
        .box1{
            background-color: limegreen;
            padding-left: 150px;
            
            /* padding thi left right up-down movement thai */
        }
        .box2{
            background-color: orchid;
        }

    </style>
</head>
<body>
    <h1>CSS box model</h1>
    <img src="css-padding.png" alt="css information">
    <div class="box box1"> i am in box 1 of box model</div>
    <div class="box box2"> i am in box 2 of box model</div>
</body>
</html>
