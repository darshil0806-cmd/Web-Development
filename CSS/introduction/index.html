<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        div {
            color: blue;
            background-color: yellow;
            font-size: 40px;
            text-align: center;
            border: 2px solid greenyellow;

            .element {
                padding-top: 20px;
                padding-right: 10px;
                padding-bottom: 15px;
                padding-left: 5px;
            }


        }
        div:hover,span{
            background-color: orange;
            cursor: pointer;

        }
        
    </style>
</head>

<body>
    <div>
        HEY I am Dasrhil and today i am learning CSS
    </div>
    <div>
        i am good </div>
    <span>
        colour of above div is not visible as i am in span
    </span>
</body>

</html>
