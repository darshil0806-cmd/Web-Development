<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid - Align and Justify</title>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      background-color: lightgreen;
      padding: 10px;
      height: 300px;
    }
    .grid-item {
      background-color: white;
      border: 1px solid #333;
      padding: 20px;
      text-align: center;
    }
    .align-top {
      align-self: start; /* Align item to the top */
    }
    .align-bottom {
      align-self: end; /* Align item to the bottom */
    }
    .justify-left {
      justify-self: start; /* Align item to the left */
    }
    .justify-center {
      justify-self: center; /* Align item to the center */
    }
  </style>
</head>
<body>
  <h2>Align and Justify Grid Items</h2>
  <div class="grid-container">
    <div class="grid-item align-top">Top</div>
    <div class="grid-item align-bottom">Bottom</div>
    <div class="grid-item justify-left">Left</div>
    <div class="grid-item justify-center">Center</div>
  </div>
</body>
</html>
